", "audio": "audio/episode01/p001-08.mp3"}], "2": [{"kind": "note", "ja": "アペックスキングネス", "en": "APEX KINGNESS", "noread": true}, {"kind": "narr", "ja": "利用できるものは", "en": "Whatever can be used—", "audio": "audio/episode01/p002-02.mp3"}, {"kind": "narr", "ja": "利用する", "en": "I will use.", "audio": "audio/episode01/p002-03.mp3"}], "3": [{"kind": "narr", "ja": "オレは最強でカッコイイ男!!", "en": "I'm the strongest, coolest guy around!!", "audio": "audio/episode01/p003-01.mp3"}, {"kind": "narr", "ja": "と自分では思っているし、実際、大学目指してる最強に万能、全教科オール5イケメン", "en": "That's what I think of myself—and in fact, I'm an all-round genius aiming for university, a handsome guy with straight A's in every subject.", "audio": "audio/episode01/p003-02.mp3"}, {"kind": "narr", "ja": "西京勝", "en": "Katsu Saikyo", "audio": "audio/episode01/p003-03.mp3"}, {"kind": "narr", "ja": "スポーツ完璧。人間性完璧。", "en": "Perfect at sports. Perfect as a person.", "audio": "audio/episode01/p003-04.mp3"}, {"kind": "narr", "ja": "学力完璧。", "en": "Perfect in grades.", "audio": "audio/episode01/p003-05.mp3"}, {"kind": "narr", "ja": "生活完璧。高校は推薦で入った。", "en": "Perfect in daily life. Got into high school on a recommendation.", "audio": "audio/episode01/p003-06.mp3"}, {"kind": "narr", "ja": "家族を亡くしたイトコが来る。元気にしてやりてぇし、話せる話題を", "en": "My cousin who lost their family is coming. I want to cheer them up, so for things we can talk about—", "audio": "audio/episode01/p003-07.mp3"}, {"kind": "narr", "ja": "といっても、誰とも話せるように、流行りとかは調べてる。流行に流されるタイプではないが、知っておくにこしたことはない", "en": "—well, I always look up what's trending so I can talk with anyone. I'm not the type to follow trends, but it never hurts to know.", "audio": "audio/episode01/p003-08.mp3"}, {"kind": "narr", "ja": "何だ…これ。", "en": "What… is this?", "audio": "audio/episode01/p003-09.mp3"}], "4": [{"kind": "narr", "ja": "噂なんだが、アイツに関わるヤツは皆、死ぬんだよ", "en": "Here's the rumor: everyone who gets involved with that kid dies.", "audio": "audio/episode01/p004-01.mp3"}, {"kind": "narr", "ja": "その子は家族を始めに失ったんだ…。立て続けにな…", "en": "First that kid lost their family… one after another…", "audio": "audio/episode01/p004-02.mp3"}, {"kind": "narr", "ja": "おかしくないか？", "en": "Isn't that strange?", "audio": "audio/episode01/p004-03.mp3"}, {"kind": "narr", "ja": "それって偶然だと思うか？ しかも死因は不明", "en": "Do you think that's a coincidence? And the cause of death is unknown.", "audio": "audio/episode01/p004-04.mp3"}, {"kind": "narr", "ja": "多分、心臓麻痺", "en": "Probably heart failure.", "audio": "audio/episode01/p004-05.mp3"}, {"kind": "narr", "ja": "そして毎回、夜にあの子と手を繋いで寝た者が死ぬ", "en": "And every time, whoever sleeps holding that kid's hand at night… dies.", "audio": "audio/episode01/p004-06.mp3"}], "5": [{"kind": "narr", "ja": "悪夢の子", "en": "The Nightmare Child.", "audio": "audio/episode01/p005-01.mp3"}, {"kind": "narr", "ja": "てい…てね。", "en": "Tei… tei.", "audio": "audio/episode01/p005-02.mp3"}], "6": [{"kind": "narr", "ja": "霊感0(ゼロ)の、おばけやしきでおばけを脅かすような怖い者なしのオレでもわかる!!", "en": "Even I can tell—me, zero sixth sense, so fearless I scare the ghosts in haunted houses!!", "audio": "audio/episode01/p006-01.mp3"}, {"kind": "narr", "ja": "…い…いや!! そんなワケ…そう!しょせん噂", "en": "N-no way!! That can't be… Right! It's just a rumor.", "audio": "audio/episode01/p006-02.mp3"}, {"kind": "narr", "ja": "そうだよ!! まさかな!! ただのイトコ、西京底帝", "en": "That's right!! No way!! Just my cousin, Teitei Saikyo.", "audio": "audio/episode01/p006-03.mp3"}, {"kind": "narr", "ja": "お外行って来るぜ!!", "en": "I'm heading out!!", "audio": "audio/episode01/p006-04.mp3"}, {"kind": "narr", "ja": "あ、うん。", "en": "Oh, okay.", "audio": "audio/episode01/p006-05.mp3"}, {"kind": "narr", "ja": "あ、うん。", "en": "Oh, okay.", "audio": "audio/episode01/p006-06.mp3"}, {"kind": "narr", "ja": "おかし代…", "en": "Snack money…", "audio": "audio/episode01/p006-07.mp3"}, {"kind": "narr", "ja": "そういうことかよ。いや!! 利用できる!!", "en": "So that's how it is. No wait!! I can use this!!", "audio": "audio/episode01/p006-08.mp3"}, {"kind": "narr", "ja": "あぁやるよ", "en": "Yeah, here you go.", "audio": "audio/episode01/p006-09.mp3"}, {"kind": "narr", "ja": "ついでにおつかいしてこい。", "en": "Run an errand for me while you're at it.", "audio": "audio/episode01/p006-10.mp3"}], "7": [{"kind": "narr", "ja": "これ買って来てくれ!!", "en": "Go buy this for me!!", "audio": "audio/episode01/p007-01.mp3"}, {"kind": "narr", "ja": "うん", "en": "Okay.", "audio": "audio/episode01/p007-02.mp3"}, {"kind": "narr", "ja": "はい!! お買い上げありがとうございます。", "en": "Yes!! Thank you for your purchase.", "audio": "audio/episode01/p007-03.mp3"}], "8": [{"kind": "narr", "ja": "…ここなら", "en": "…Here, then.", "audio": "audio/episode01/p008-01.mp3"}, {"kind": "narr", "ja": "今日はありがとよ。電気消すぞ", "en": "Thanks for today. I'm turning off the light.", "audio": "audio/episode01/p008-02.mp3"}, {"kind": "narr", "ja": "一人で", "en": "Alone…", "audio": "audio/episode01/p008-03.mp3"}, {"kind": "narr", "ja": "寝る", "en": "I'll sleep.", "audio": "audio/episode01/p008-04.mp3"}, {"kind": "narr", "ja": "なんか言ったか？強…？", "en": "Did you say something? Tsuyoshi…?", "audio": "audio/episode01/p008-05.mp3"}], "9": [{"kind": "narr", "ja": "悪夢でも見てるのか？", "en": "Is the kid having a nightmare?", "audio": "audio/episode01/p009-01.mp3"}, {"kind": "narr", "ja": "今、何か…何か…布団の毛のようなものに…起こされかけた!?", "en": "Just now, something… something… like the fuzz of a futon… almost woke me up!?", "audio": "audio/episode01/p009-02.mp3"}, {"kind": "narr", "ja": "あれ？ どっちが現実だ？", "en": "Huh? Which one is reality?", "audio": "audio/episode01/p009-03.mp3"}, {"kind": "narr", "ja": "気のせいか…", "en": "Must be my imagination…", "audio": "audio/episode01/p009-04.mp3"}], "10": [{"kind": "narr", "ja": "強がいない!? しかもパジャマじゃない!?", "en": "Tsuyoshi's gone!? And he's not even in his pajamas!?", "audio": "audio/episode01/p010-01.mp3"}, {"kind": "narr", "ja": "いったい何が…暗!!", "en": "What on earth… It's so dark!!", "audio": "audio/episode01/p010-02.mp3"}, {"kind": "narr", "ja": "ていてい!! 起きたか!? 大変だ!!", "en": "Teitei!! You awake!? This is bad!!", "audio": "audio/episode01/p010-03.mp3"}, {"kind": "narr", "ja": "まままさか、オレの弟ッ、あの西京強が、夜に家出した!!!??", "en": "N-n-no way… my little brother, THE Tsuyoshi Saikyo, ran away from home at night!!!??", "audio": "audio/episode01/p010-04.mp3"}, {"kind": "narr", "ja": "こうしちゃいられん!! 外に!!", "en": "I can't just sit here!! Outside!!", "audio": "audio/episode01/p010-05.mp3"}, {"kind": "narr", "ja": "…!?マズい!!!", "en": "…!? This is bad!!!", "audio": "audio/episode01/p010-06.mp3"}], "11": [{"kind": "narr", "ja": "外に出るな!!", "en": "Don't go outside!!", "audio": "audio/episode01/p011-01.mp3"}, {"kind": "narr", "ja": "暗殺者がいる!!", "en": "There's an assassin!!", "audio": "audio/episode01/p011-02.mp3"}], "13": [{"kind": "narr", "ja": "噂なんだが、アイツに関わるヤツは皆、死ぬんだよ", "en": "Here's the rumor: everyone who gets involved with that kid dies.", "audio": "audio/episode01/p013-01.mp3"}, {"kind": "narr", "ja": "夜にあの子と手を繋いで寝た者が死ぬ", "en": "Whoever sleeps holding that kid's hand at night… dies.", "audio": "audio/episode01/p013-02.mp3"}, {"kind": "narr", "ja": "悪夢の子", "en": "The Nightmare Child.", "audio": "audio/episode01/p013-03.mp3"}, {"kind": "narr", "ja": "ていてい…", "en": "Teitei…", "audio": "audio/episode01/p013-04.mp3"}, {"kind": "narr", "ja": "夢…か…", "en": "A dream…?", "audio": "audio/episode01/p013-05.mp3"}, {"kind": "narr", "ja": "逃げよう勝さん！ 死んだら死ぬよ!!", "en": "Let's run, Katsu! If you die, you die!!", "audio": "audio/episode01/p013-06.mp3"}, {"kind": "narr", "ja": "に…!? 逃げるったって、人サイズのカマキリから逃げれる訳ねーだろ!! ただでさえ、自分よりも大きいの殺すバケモノなのに", "en": "R-run!? How are we supposed to outrun a human-sized mantis!! It's a monster that kills things bigger than itself as it is!", "audio": "audio/episode01/p013-07.mp3"}], "14": [{"kind": "narr", "ja": "釣って", "en": "Reel it in.", "audio": "audio/episode01/p014-01.mp3"}, {"kind": "narr", "ja": "『メタスラちゃん』", "en": "\"Metasura-chan.\"", "audio": "audio/episode01/p014-02.mp3"}], "15": [{"kind": "narr", "ja": "!!? そうか!! 夢だから何でもアリ", "en": "!!? I get it!! It's a dream, so anything goes!", "audio": "audio/episode01/p015-01.mp3"}, {"kind": "narr", "ja": "そんなワケないだろ", "en": "No way, that's not it.", "audio": "audio/episode01/p015-02.mp3"}, {"kind": "narr", "ja": "ここはメタスラちゃんに任せて、とんずらするよ", "en": "Let's leave this to Metasura-chan and make a run for it.", "audio": "audio/episode01/p015-03.mp3"}, {"kind": "narr", "ja": "ここまで来れば", "en": "We should be safe this far…", "audio": "audio/episode01/p015-04.mp3"}, {"kind": "narr", "ja": "なんだ。でも夢か。", "en": "Phew. But it's just a dream, right?", "audio": "audio/episode01/p015-05.mp3"}, {"kind": "narr", "ja": "違うよ。夢が現実。現実が夢だよ。", "en": "No. The dream is reality. Reality is the dream.", "audio": "audio/episode01/p015-06.mp3"}, {"kind": "narr", "ja": "人類はまだ生まれてなくて、私達はもしも人類が生まれたら、というような存在。相手もそう。", "en": "Humanity hasn't been born yet. We're beings of \"what if humanity were born.\" So are they.", "audio": "audio/episode01/p015-07.mp3"}, {"kind": "narr", "ja": "だから", "en": "So…", "audio": "audio/episode01/p015-08.mp3"}, {"kind": "narr", "ja": "お互い、未来の己の類のために争ってる。地球人ってことだ…相手も…だから私はこう呼ぶ…", "en": "We're each fighting for the future of our own kind. They're 'people of Earth' too… so I call them…", "audio": "audio/episode01/p015-09.mp3"}, {"kind": "narr", "ja": "亜人", "en": "Demi-humans.", "audio": "audio/episode01/p015-10.mp3"}, {"kind": "narr", "ja": "人のような、人ではない何か…!!だと!?", "en": "Something like a person, but not a person…!! Are you serious!?", "audio": "audio/episode01/p015-11.mp3"}, {"kind": "narr", "ja": "だからこの悪夢で殺し合いになり、最後の種が現実を現実にする…ややこしいわ!", "en": "So in this nightmare we kill each other, and the last species standing makes its reality real… That's way too complicated!", "audio": "audio/episode01/p015-12.mp3"}]}}</script><script src="js/listen.js?v=f0630519" defer></script></body></html>
